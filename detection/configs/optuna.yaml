# Otimização de hiperparâmetros com Optuna (scripts/tune_optuna.py).
#
# A base é a melhor configuração do experimento indicado em `inherit_best`
# (modelo, imgsz, aumento de dados e estratégia de desbalanceamento já
# decididos). O Optuna mexe só no que ainda não foi decidido: otimização,
# pesos da perda e intensidade do aumento.
#
# Objetivo: `selection_metric` na VALIDAÇÃO (fold0). O teste nunca é usado aqui.

study_name: hparams_v1
inherit_best: 05_imbalance
# depois do estudo, o E7 e o E8 herdam o melhor entre 05_imbalance e 06b_optuna_confirm
experiment: 06_optuna           # nome no registro / pasta de resultados
n_trials: 40
timeout_h: null                 # limite de tempo total (horas), opcional
sampler: {type: tpe, seed: 42, n_startup_trials: 10}
# Poda (pruning): interrompe trials ruins cedo, comparando com a mediana dos
# trials anteriores na mesma época. Economiza boa parte do tempo.
pruner: {type: median, n_startup_trials: 8, n_warmup_steps: 20}

# Trials mais curtos que o treino final (o ranking entre configs costuma se
# manter); a confirmação (--confirm-top) treina as melhores por completo.
trial_overrides:
  train: {epochs: 80, patience: 20, plots: false}

search_space:
  # ATENÇÃO: com optimizer=auto a Ultralytics ignora lr0 e momentum; por isso o
  # otimizador entra no espaço de busca explicitamente.
  train.optimizer: {type: categorical, choices: [SGD, AdamW]}
  train.lr0: {type: float, low: 1.0e-4, high: 2.0e-2, log: true}
  train.lrf: {type: float, low: 0.01, high: 0.3, log: true}
  train.momentum: {type: float, low: 0.8, high: 0.98}
  train.weight_decay: {type: float, low: 1.0e-5, high: 1.0e-2, log: true}
  train.warmup_epochs: {type: float, low: 0.0, high: 5.0}
  train.cos_lr: {type: categorical, choices: [false, true]}
  train.box: {type: float, low: 4.0, high: 10.0}
  train.cls: {type: float, low: 0.3, high: 1.5}
  train.scale: {type: float, low: 0.2, high: 0.8}
  train.mosaic: {type: float, low: 0.5, high: 1.0}
  train.hsv_v: {type: float, low: 0.2, high: 0.7}
  train.degrees: {type: float, low: 0.0, high: 8.0}
  train.close_mosaic: {type: int, low: 0, high: 25}
