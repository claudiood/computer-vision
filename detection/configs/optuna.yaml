# E6 — Otimização dos hiperparâmetros de TREINO com Optuna (scripts/tune_optuna.py).
#
# A base é a configuração vigente ao fim do E1–E5 (modelo, tamanho, resolução,
# CLAHE e aumento de dados já decididos). O Optuna mexe só no que falta:
# otimizador, taxa de aprendizado e pesos da perda. O aumento de dados vem antes
# porque o melhor lr0 depende de quanto aumento existe.
#
# Objetivo: `selection_metric` na VALIDAÇÃO do fold 0. O teste nunca é usado aqui.
# Depois do estudo, o melhor trial é treinado por completo no E6b
# (python scripts/run_experiment.py 06b_optuna_best) e só é adotado se superar a
# configuração vigente por mais que a margem.

study_name: hparams_v3
inherit_best: [01_baseline, 02_models, 03_imgsz, 04_clahe, 05_augmentation]
experiment: 06_optuna           # nome no registro / pasta de resultados
n_trials: 12
timeout_h: null                 # limite de tempo total (horas), opcional
sampler: {type: tpe, seed: 42, n_startup_trials: 5}
# Poda (pruning): interrompe trials ruins cedo, comparando com a mediana dos
# trials anteriores na mesma época. Economiza boa parte do tempo.
pruner: {type: median, n_startup_trials: 5, n_warmup_steps: 15}

# Trials mais curtos que o treino normal (o ranking entre configs costuma se
# manter). O E6b treina o melhor com o número normal de épocas.
trial_overrides:
  train: {epochs: 50, patience: 15, plots: false}

# Na rodada anterior, cls e lr0 foram de longe os mais importantes; momentum,
# weight_decay, warmup e cos_lr tiveram importância perto de zero e ficam no padrão.
search_space:
  # ATENÇÃO: com optimizer=auto a Ultralytics ignora lr0; por isso o otimizador é fixado.
  train.optimizer: {type: categorical, choices: [SGD, AdamW]}
  train.lr0: {type: float, low: 1.0e-4, high: 2.0e-2, log: true}
  train.lrf: {type: float, low: 0.01, high: 0.3, log: true}
  train.box: {type: float, low: 5.0, high: 10.0}
  train.cls: {type: float, low: 0.3, high: 1.5}
