# Configuração-base de TODOS os treinos. Os experimentos (configs/experiments/*.yaml)
# herdam deste arquivo e mudam só o que estão testando (uma coisa por vez).
#
# Chaves de topo (do pipeline):
#   dataset           versão do dataset preparado (data/<dataset>/), gerada pelo 02_prepare_dataset.py
#   data              fold0..fold4 (validação = esse fold), trainval, ou caminho de um data.yaml
#   model             pesos iniciais (.pt, pré-treinados no COCO) ou arquitetura (.yaml, do zero)
#   device            auto (cuda > mps > cpu), 0, mps, cpu
#   selection_metric  métrica usada para escolher a melhor variante de cada experimento
#   op_conf           limiar de confiança do "ponto de operação" (P_op/R_op/F1_op)
#   oversample        estratégia contra desbalanceamento (null = desligado); escolhida pelo Optuna (E5)
#   train             argumentos repassados a model.train() da Ultralytics

dataset: pavement_v3
data: fold0
model: yolo26n.pt
device: auto
selection_metric: mAP50_95   # o mesmo critério que a Ultralytics usa para salvar o best.pt
op_conf: 0.25
oversample: null

train:
  epochs: 100          # teto; o early stopping (patience) decide onde parar
  patience: 25         # na rodada anterior a melhor época ficou entre 20 e 70
  imgsz: 960           # E3 testa 1280
  batch: 8             # o MESMO batch em todos os experimentos (cabe 26s a 1280 na A6000)
  optimizer: auto      # com auto, lr0 é ignorado; o Optuna fixa o otimizador
  seed: 0
  deterministic: true
  workers: 6           # = vCPUs da máquina; o carregamento de imagens era o gargalo
  cache: disk          # guarda as imagens decodificadas (.npy): poupa a CPU a cada época.
                       # 'ram' é parecido, mas a Ultralytics avisa que não é determinístico
  amp: true
  plots: true
  val: true
  # --- aumento de dados: padrões da Ultralytics, escritos aqui para ficarem explícitos
  mosaic: 1.0
  close_mosaic: 10
  scale: 0.5
  translate: 0.1
  degrees: 0.0
  shear: 0.0
  perspective: 0.0
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  fliplr: 0.5
  flipud: 0.0
  mixup: 0.0
  cutmix: 0.0
