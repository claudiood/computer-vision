# E8 — Treino definitivo com a configuração vencedora.
# Mais épocas e paciência (o early stopping decide onde parar) e 3 seeds: o
# resultado final é a MÉDIA ± desvio no teste, não o melhor seed (escolher o
# melhor seed olhando o teste seria vazamento).
# A variante trainval (opcional) treina em treino+validação, com o número de
# épocas fixo na mediana das best_epoch das seeds; sem validação independente,
# só use se o grupo concordar e relate isso.
extends: ../base_train.yaml
name: 08_final
description: configuração final, mais épocas, 3 seeds (avaliada no teste UMA vez)
# o melhor entre o E5 e a confirmação do Optuna (se o Optuna não ajudou, fica o E5)
inherit_best: [05_imbalance, 06b_optuna_confirm]
seeds: [0, 1, 2]
overrides:
  train: {epochs: 300, patience: 50}
variants:
  final: {}
  # final_trainval: {data: trainval, train: {epochs: 120, patience: 0}}   # ajuste 'epochs' antes de usar
