# E3 — Resolução de entrada (imgsz) com o melhor modelo até aqui (E1/E2).
# As rachaduras são finas: em resoluções menores elas podem sumir. O 960 já
# foi treinado (E1/E2) e entra como referência, sem treinar de novo.
# Custo: tempo cresce ~ imgsz². O batch fica igual (8) para a comparação ser justa.
# Se o E2 empatar (diferença inconsistente entre os folds), rode também o 1280
# no segundo modelo:  --set model=<modelo>.pt  (o resultado entra no registro).
extends: ../base_train.yaml
name: 03_imgsz
description: imgsz 1280 com o melhor modelo do E1/E2 (o 960 vem de lá), folds 0-2
inherit_best: [01_baseline, 02_models]
folds: [0, 1, 2]
seeds: [0]
include_best:
  imgsz 960 (E1/E2): [01_baseline, 02_models]
reference: imgsz 960 (E1/E2)
variants:
  imgsz_1280: {train: {imgsz: 1280}}
