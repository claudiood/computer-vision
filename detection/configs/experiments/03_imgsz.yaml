# E3 — Resolução de entrada (imgsz), com o melhor modelo do E2.
# As fotos têm de 0,2 a 16 MP e as rachaduras são finas: em 640 px uma
# rachadura de poucos pixels de largura pode sumir. A auditoria mede o menor
# lado das caixas em cada imgsz. Custo: memória e tempo crescem ~ imgsz²,
# por isso o batch cai junto.
extends: ../base_train.yaml
name: 03_imgsz
description: imgsz 640 / 960 / 1280 com o melhor modelo do 02_models
inherit_best: 02_models
seeds: [0]
reference: imgsz_640
variants:
  imgsz_640: {train: {imgsz: 640, batch: 16}}
  imgsz_960: {train: {imgsz: 960, batch: 8}}
  imgsz_1280: {train: {imgsz: 1280, batch: 4}}
