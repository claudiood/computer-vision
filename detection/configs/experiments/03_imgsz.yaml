# E3 — Resolução de entrada (imgsz) com o melhor modelo do E1/E2.
# Rachaduras finas e buracos pequenos somem em resoluções menores; as fotos têm
# até 12 MP, então há detalhe de sobra. O 960 já foi treinado e entra como referência.
# Custo: tempo cresce ~ imgsz² (1280 ≈ 1,8×, 1600 ≈ 2,8× o 960). O batch fica igual (8).
# O preparo usa max_side 1600, para o 1600 não ser só imagem ampliada.
extends: ../base_train.yaml
name: 03_imgsz
description: imgsz 1280 e 1600 com o melhor modelo do E1/E2 (o 960 vem de lá), fold 0
inherit_best: [01_baseline, 02_models]
folds: [0]
seeds: [0]
include_best:
  imgsz 960 (E1/E2): [01_baseline, 02_models]
reference: imgsz 960 (E1/E2)
variants:
  imgsz_1280: {train: {imgsz: 1280}}
  imgsz_1600: {train: {imgsz: 1600}}
