# E3 — Resolução de entrada (imgsz) com o melhor modelo do E1/E2.
# Rachaduras finas e buracos pequenos somem em resoluções menores. O 960 já foi
# treinado (E1/E2) e entra como referência. O 1600 saiu nesta rodada: perdeu na
# rodada de 26/11, é o treino mais caro e as fotos não ganham detalhe acima de 1280.
# Custo: o 1280 leva ~1,8× o tempo do 960. O batch fica igual (8).
extends: ../base_train.yaml
name: 03_imgsz
description: imgsz 1280 com o melhor modelo do E1/E2 (o 960 vem de lá), fold 0
inherit_best: [01_baseline, 02_models]
folds: [0]
seeds: [0]
include_best:
  imgsz 960 (E1/E2): [01_baseline, 02_models]
reference: imgsz 960 (E1/E2)
variants:
  imgsz_1280: {train: {imgsz: 1280}}
