# E7 — Ablação: parte da configuração final e REMOVE um componente por vez,
# para medir quanto cada decisão contribui (e se alguma não contribui nada).
# Se um componente não foi adotado (ex.: o oversampling perdeu no E5), a
# variante correspondente fica igual ao 'full': rode só as que fazem sentido
# com --variants.
# 3 seeds: as diferenças aqui costumam ser pequenas.
extends: ../base_train.yaml
name: 07_ablation
description: configuração final menos um componente por vez (3 seeds)
# o melhor entre o E5 e a confirmação do Optuna (se o Optuna não ajudou, fica o E5)
inherit_best: [05_imbalance, 06b_optuna_confirm]
seeds: [0, 1, 2]
reference: full
variants:
  full: {}
  minus_optuna_hparams:               # volta os hiperparâmetros de otimização ao padrão
    train: {optimizer: auto, lr0: 0.01, lrf: 0.01, momentum: 0.937, weight_decay: 0.0005,
            warmup_epochs: 3.0, box: 7.5, cls: 0.5}
  minus_augmentation:                 # volta o aumento de dados ao padrão da Ultralytics
    train: {mosaic: 1.0, close_mosaic: 10, scale: 0.5, translate: 0.1, degrees: 0.0, shear: 0.0,
            perspective: 0.0, hsv_h: 0.015, hsv_s: 0.7, hsv_v: 0.4, fliplr: 0.5, mixup: 0.0}
  minus_oversampling:
    oversample: null
  minus_preprocessing:
    dataset: pavement_v2
  minus_imgsz:
    train: {imgsz: 640, batch: 16}
  minus_model:                        # modelo da linha de base
    model: yolo26n.pt
