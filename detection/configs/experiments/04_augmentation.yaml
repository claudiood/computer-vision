# E4 — Aumento de dados e pré-processamento, um fator por vez contra o controle.
# Pergunta da aula: "essa variação aparece quando o modelo estiver em uso?"
# As fotos são de celular, em perspectiva (rua, horizonte, céu): giro pequeno
# acontece (celular inclinado), luz varia muito (sombra, sol, asfalto molhado)
# e a distância também. Espelhar na vertical (flipud) NÃO acontece em foto em
# perspectiva (céu embaixo): fica de fora. Rachadura/remendo/buraco não são
# definidos pela cor: matiz pode variar um pouco.
extends: ../base_train.yaml
name: 04_augmentation
description: aumento de dados (um fator por vez) + CLAHE como pré-processamento
inherit_best: 03_imgsz
seeds: [0]
variants:
  control: {}                         # padrões da Ultralytics (referência)
  no_aug:                             # sem aumento: mostra quanto o aumento padrão ajuda
    train: {mosaic: 0.0, scale: 0.0, translate: 0.0, fliplr: 0.0, hsv_h: 0.0, hsv_s: 0.0, hsv_v: 0.0, close_mosaic: 0}
  rotate_5:                           # celular levemente inclinado
    train: {degrees: 5.0}
  light_strong:                       # sombras, sol forte, asfalto molhado
    train: {hsv_v: 0.6, hsv_s: 0.8}
  scale_strong:                       # danos perto e longe da câmera
    train: {scale: 0.75}
  perspective:                        # ângulo da câmera em relação ao chão
    train: {perspective: 0.0005}
  mixup_01:                           # regularização forte (aula: mais útil em modelos maiores)
    train: {mixup: 0.1}
  close_mosaic_20:                    # mais épocas finais com imagens "normais"
    train: {close_mosaic: 20}
  clahe:                              # PRÉ-processamento: CLAHE no canal L (aula, slide 20)
    dataset: pavement_v2_clahe        # gerado com: 02_prepare_dataset.py --preprocess clahe
