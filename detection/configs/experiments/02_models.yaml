# E2 — Tamanhos s e m da família vencedora do E1 ({family} = yolo26 ou yolo11).
# O n já foi treinado no E1 e entra como referência, sem treinar de novo.
# l e x ficam de fora: com ~150 imagens tendem a decorar o treino e custam muito tempo.
# Um tamanho maior só é adotado se superar o n por mais que a margem (adopt_margin).
extends: ../base_train.yaml
name: 02_models
description: tamanhos s e m da família vencedora do E1 (o n vem do E1), fold 0
inherit_best: [01_baseline]
folds: [0]
seeds: [0]
include_best:
  n (E1): [01_baseline]
reference: n (E1)
variants:
  s: {model: "{family}s.pt"}
  m: {model: "{family}m.pt"}
