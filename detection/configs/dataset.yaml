# Configuração do dataset de detecção de danos em pavimentos.
# Caminhos relativos são resolvidos a partir da pasta detection/.

source:
  images: ../dataset/detection/images          # pasta plana com todas as imagens
  labels: ../dataset/detection/labels          # .txt YOLO exportados do Make Sense
  class_names_file: ../dataset/detection/labels/labels.txt  # ordem oficial das classes
  annotator_dirs: ../imagens/detection         # subpastas = anotadores (auditoria/estratificação)

# A ORDEM define o número da classe nos .txt (0, 1, 2). Conferida contra o labels.txt.
classes: [rachadura, remendo, buraco]
classes_en: [crack, patch, pothole]

# Imagem -> rótulo, quando os nomes não batem (achado na auditoria).
label_aliases:
  C35BCB13-3E29-4163-8A9D-FD28C694A963_1_201_a.heic: C35BCB13-3E29-4163-8A9D-FD28C694A963.txt

# Imagens sem .txt: "exclude" (ficam fora) ou "background" (entram como imagens sem objetos).
# pavement_v3 (nova rotulação): imagem sem .txt fica FORA. Uma imagem só entra como
# fundo (sem objetos) se alguém conferiu que ela não tem dano nenhum: liste-a abaixo.
# Fundo com dano visível ensina o modelo a ignorar o dano e conta acerto como falso positivo.
unlabeled_policy: exclude
# Imagens conferidas pelo grupo como fundo verdadeiro (sem dano). Ex.: [IMG_1234.jpg]
background_images: []
# Imagens a excluir do dataset (ex.: decisão do grupo após a auditoria).
exclude: []

clean:
  min_wh: 0.001        # caixas com largura/altura normalizada menor que isso são removidas

prepare:
  name: pavement_v3    # nome da versão do dataset preparado (data/<name>/): nova rotulação
  max_side: 1280       # = maior imgsz testado (1280). Imagens menores = leitura e cache mais rápidos
  jpeg_quality: 95
  test_fraction: 0.15  # teste fixo, usado UMA vez no fim
  folds: 5             # folds sobre o restante; o fold 0 é a validação padrão (~17% do total)
  seed: 42
  restarts: 300        # reinícios da busca de divisão estratificada
  # Agrupamento de fotos da MESMA CENA (ficam sempre na mesma partição).
  # As fotos foram tiradas em saídas de grupo com o mesmo celular e depois
  # divididas entre os anotadores: o mesmo buraco aparece em fotos de pessoas
  # diferentes, com segundos de diferença. Sem agrupar, a validação e o teste
  # avaliam cenas que o modelo já viu no treino (métricas otimistas).
  # Por isso o agrupamento usa data/hora do EXIF, numeração da câmera e dHash.
  # Para desligar (dividir por imagem): os três valores em 0.
  grouping:
    hash_threshold: 70   # dHash 256 bits: <= N bits = cópia/reexportação
    time_window_s: 30    # mesma câmera e < N s entre as fotos = mesma cena
    seq_window: 2        # fotos sem data: numeração da câmera a até N números = mesma sequência
